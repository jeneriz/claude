name: Deploy games to GitHub Pages

on:
  push:
    # claude/number-munchers-game-ckgvp is the repository's default branch
    branches: ["main", "claude/number-munchers-game-ckgvp"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        # Every top-level directory containing an index.html is treated as a
        # game and copied into the site, then a landing page is generated
        # linking to each one. Adding a new game folder requires no changes here.
        run: |
          mkdir -p _site
          cards=""
          for dir in */; do
            name="${dir%/}"
            [ -f "$dir/index.html" ] || continue
            cp -r "$dir" "_site/$name"
            title=$(sed -n 's/.*<title>\(.*\)<\/title>.*/\1/p' "$dir/index.html" | head -1)
            [ -n "$title" ] || title="$name"
            cards="$cards<a class=\"card\" href=\"./$name/\"><h2>$title</h2><p>$name</p></a>"
          done
          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mini Games</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                background: #1a1a2e;
                color: #eee;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 2rem 1rem;
                box-sizing: border-box;
              }
              h1 { margin: 1rem 0 2rem; }
              .games {
                display: flex;
                flex-wrap: wrap;
                gap: 1.5rem;
                justify-content: center;
                max-width: 60rem;
              }
              .card {
                background: #16213e;
                border: 2px solid #0f3460;
                border-radius: 1rem;
                padding: 1.5rem 2rem;
                min-width: 12rem;
                text-align: center;
                text-decoration: none;
                color: inherit;
                transition: transform .15s, border-color .15s;
              }
              .card:hover { transform: translateY(-4px); border-color: #e94560; }
              .card h2 { margin: 0 0 .5rem; font-size: 1.4rem; }
              .card p { margin: 0; color: #8899bb; font-size: .9rem; }
            </style>
          </head>
          <body>
            <h1>🎮 Mini Games</h1>
            <div class="games">$cards</div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Enable Pages with the Actions source automatically if it isn't yet
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
