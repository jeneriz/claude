<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌟 Muncher!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
      background: linear-gradient(160deg, #fef9c3 0%, #ede9fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 20px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      font-family: 'Fredoka One', 'Comic Sans MS', cursive;
      font-size: 2.2rem;
      color: #6d28d9;
      text-shadow: 3px 3px 0 #ddd6fe;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    /* ── TOP BAR ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
      width: 100%;
      max-width: 600px;
    }

    .topic-select {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 7px 12px;
      border: 3px solid #7c3aed;
      border-radius: 14px;
      background: white;
      color: #4c1d95;
      cursor: pointer;
      outline: none;
      flex: 1;
      min-width: 140px;
    }
    .topic-select:focus { border-color: #4338ca; }

    #lives {
      font-size: 1.35rem;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* ── SCORE BAR ── */
    #scorebar {
      display: flex;
      gap: 20px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #4c1d95;
      margin-bottom: 8px;
    }

    /* ── CHALLENGE BANNER ── */
    #challenge {
      font-family: 'Fredoka One', 'Comic Sans MS', cursive;
      font-size: 1.25rem;
      color: white;
      background: linear-gradient(135deg, #7c3aed, #4338ca);
      border-radius: 18px;
      padding: 10px 22px;
      margin-bottom: 10px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(109,40,217,0.35);
      max-width: 600px;
      width: 100%;
    }

    /* ── GRID ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      width: 100%;
      max-width: 600px;
    }

    /* ── CELL ── */
    .cell {
      background: white;
      border: 3px solid #c4b5fd;
      border-radius: 12px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #3730a3;
      cursor: pointer;
      /* FIX: word-break:normal + hyphens:none prevent orphaned single letters */
      word-break: normal;
      overflow-wrap: break-word;
      hyphens: none;
      text-align: center;
      padding: 4px 3px;
      line-height: 1.15;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
    }
    .cell:active { transform: scale(0.94); }

    .cell.muncher-here {
      border-color: #f59e0b;
      background: #fef3c7;
      box-shadow: 0 0 0 2px #fcd34d inset;
    }

    .cell.eaten-cell {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .cell.wrong-flash {
      background: #fee2e2 !important;
      border-color: #fca5a5 !important;
      animation: shake 0.45s ease;
    }

    .cell.debug-valid {
      background: #dcfce7 !important;
      border-color: #4ade80 !important;
    }
    .cell.debug-invalid {
      background: #fee2e2 !important;
      border-color: #f87171 !important;
    }

    .cell.correct-pop {
      animation: pop 0.22s ease;
    }

    .muncher-icon {
      font-size: 1.55rem;
      line-height: 1;
      display: block;
    }

    .cell-label {
      font-size: inherit;
      line-height: 1.15;
    }

    /* shrink label when muncher is also displayed */
    .cell.muncher-here .cell-label {
      font-size: 0.58em;
      color: #6d28d9;
    }

    .eaten-check {
      font-size: 1.4rem;
      color: #6ee7b7;
    }

    /* ── ANIMATIONS ── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%       { transform: translateX(-7px); }
      35%       { transform: translateX(7px); }
      55%       { transform: translateX(-5px); }
      75%       { transform: translateX(5px); }
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    /* ── INSTRUCTIONS ── */
    #instructions {
      margin-top: 10px;
      font-size: 0.7rem;
      color: #7c3aed;
      text-align: center;
      opacity: 0.8;
      line-height: 1.6;
    }

    /* ── OVERLAY ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.52);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #overlay.visible { display: flex; }

    #overlay-box {
      background: white;
      border-radius: 28px;
      padding: 36px 40px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      animation: popIn 0.3s cubic-bezier(.18,.89,.32,1.28);
    }
    @keyframes popIn {
      from { transform: scale(0.65); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    #overlay-emoji  { font-size: 4rem; display: block; margin-bottom: 4px; }
    #overlay-title  {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: #4c1d95;
      margin: 4px 0 10px;
    }
    #overlay-msg {
      font-size: 1rem;
      color: #6b7280;
      margin-bottom: 22px;
      line-height: 1.55;
      white-space: pre-line;
    }
    #overlay-btn {
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 12px 36px;
      background: linear-gradient(135deg, #7c3aed, #4338ca);
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(109,40,217,0.35);
      transition: transform 0.1s;
    }
    #overlay-btn:hover  { transform: scale(1.05); }
    #overlay-btn:active { transform: scale(0.97); }
  </style>
</head>

<script>
'use strict';

// ─────────────────────────────────────────
//  UTILITIES
// ─────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickN(arr, n) {
  return shuffle(arr).slice(0, n);
}

// ─────────────────────────────────────────
//  TOPIC: Multiples of N  (with capped max)
// ─────────────────────────────────────────

function multiplesTopic(n, maxVal) {
  const correct   = [];
  const incorrect = [];
  for (let i = 1; i <= maxVal; i++) {
    (i % n === 0 ? correct : incorrect).push(i);
  }
  return {
    id:        `mult${n}_${maxVal}`,
    label:     `Multiples of ${n}`,
    icon:      '🔢',
    challenge: `🍽️  Eat all multiples of ${n}!`,
    generate(nc, ni) {
      // Use however many correct items are available (may be fewer than nc)
      const avail      = Math.min(nc, correct.length);
      const fillWrong  = (nc + ni) - avail;
      return shuffle([
        ...pickN(correct,   avail)     .map(v => ({ label: String(v), isCorrect: true  })),
        ...pickN(incorrect, fillWrong) .map(v => ({ label: String(v), isCorrect: false })),
      ]);
    }
  };
}

// ─────────────────────────────────────────
//  GENERIC LIST TOPIC FACTORY
// ─────────────────────────────────────────

function listTopic({ id, label, icon, challenge, correct, incorrect }) {
  return {
    id, label, icon, challenge,
    generate(nc, ni) {
      const avail      = Math.min(nc, correct.length);
      const fillWrong  = (nc + ni) - avail;
      const actualWrong = Math.min(fillWrong, incorrect.length);
      const actualRight = (nc + ni) - actualWrong;
      return shuffle([
        ...pickN(correct,   actualRight) .map(v => ({ label: v, isCorrect: true  })),
        ...pickN(incorrect, actualWrong) .map(v => ({ label: v, isCorrect: false })),
      ]);
    }
  };
}

// ─────────────────────────────────────────
//  TOPIC: Spanish Rivers — Geography
//
//  Main rivers (reach the sea directly):
//   • Cantábrico: Bidasoa, Oria, Urola, Deba, Nervión, Navia, Nalón, Sella, Pas, Nansa, Eo
//   • Atlántico:  Miño, Duero, Tajo, Guadiana, Guadalquivir, Odiel, Tinto, Guadalete
//   • Mediterráneo: Ebro, Ter, Fluvià, Llobregat, Besós, Turia, Júcar, Segura,
//                   Guadalhorce, Andarax, Guadalfeo
//
//  Tributary rivers (afluentes, flow into another river):
//   • → Miño:         Sil, Avia, Arnoia, Tea
//   • → Duero:        Pisuerga, Esla, Adaja, Tormes, Valderaduey, Cega, Duratón, Riaza, Huebra
//   • → Tajo:         Jarama, Alberche, Tiétar, Alagón, Almonte, Salor
//   • → Guadalquivir: Genil, Guadalimar, Jándula, Guadajoz, Corbones, Viar
//   • → Guadiana:     Zújar, Jabalón, Cigüela, Bullaque
//   • → Ebro:         Aragón, Gállego, Cinca, Segre, Jalón, Oja, Tirón, Najerilla,
//                     Iregua, Ega, Martín, Guadalope, Matarraña, Huerva
//   • Otros:          Narcea (→Nalón), Órbigo/Cea (→Esla), Arlanzón (→Pisuerga),
//                     Noguera Pallaresa/Ribagorzana (→Segre), Arga (→Aragón),
//                     Henares/Manzanares/Guadarrama (→Jarama),
//                     Cabriel/Magro (→Júcar), Mundo (→Segura)
// ─────────────────────────────────────────

const RIOS_CANTABRICO   = ['Bidasoa','Oria','Urola','Deba','Nervión','Navia','Nalón','Sella','Pas','Nansa','Eo'];
const RIOS_ATLANTICO    = ['Miño','Duero','Tajo','Guadiana','Guadalquivir','Odiel','Tinto','Guadalete'];
const RIOS_MEDITERRANEO = ['Ebro','Ter','Fluvià','Llobregat','Besós','Turia','Júcar','Segura','Guadalhorce','Andarax','Guadalfeo'];

const TRIB_MIÑO         = ['Sil','Avia','Arnoia','Tea'];
const TRIB_DUERO        = ['Pisuerga','Esla','Adaja','Tormes','Valderaduey','Cega','Duratón','Riaza','Huebra'];

const TRIB_EBRO         = ['Aragón','Gállego','Cinca','Segre','Jalón','Oja','Tirón','Najerilla','Iregua','Ega','Martín','Guadalope','Matarraña','Huerva'];

const CATEGORIES = [

// ─────────────────────────────────────────
//  POPULATE DROPDOWNS

const $catSelect   = document.getElementById('categorySelect');
const $topicSelect = document.getElementById('topicSelect');

function initCategorySelect() {
  $catSelect.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const opt = document.createElement('option');
    opt.value       = cat.id;
    opt.textContent = `${cat.icon}  ${cat.label}`;
    $catSelect.appendChild(opt);
  });
}

function initTopicSelect(catId) {
  $topicSelect.innerHTML = '';
  TOPICS_BY_CAT[catId].forEach((t, i) => {
    const opt = document.createElement('option');
    opt.value       = i;
    opt.textContent = `${t.icon}  ${t.label}`;
    $topicSelect.appendChild(opt);
  });
  $topicSelect.value = 0;
}

// ─────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────

const ROWS        = 6;
const COLS        = 5;
const TOTAL       = ROWS * COLS;   // 30
const N_CORRECT   = 20;
const N_INCORRECT = TOTAL - N_CORRECT; // 10
const MAX_LIVES   = 7;
const INIT_LIVES  = 5;

// ─────────────────────────────────────────
//  GAME STATE
// ─────────────────────────────────────────

let G = {
  lives:     INIT_LIVES,
  level:     1,
  catId:     'simple-math',
  topicIdx:  0,
  grid:      [],   // [{label, isCorrect, eaten, row, col}]
  mRow:      0,
  mCol:      0,
  eaten:     0,    // correct cells eaten this level
  nCorrect:  N_CORRECT, // actual correct cells this board (may vary by topic)
  gameOver:  false,
  locked:    false, // true during wrong-eat animation
  lastClick: { row: -1, col: -1, t: 0, count: 0 }, // tap tracking (shared)
  debugMode: false,
};

// ─────────────────────────────────────────
//  BOARD GENERATION
// ─────────────────────────────────────────

function generateBoard() {
  const topic = TOPICS_BY_CAT[G.catId][G.topicIdx];
  const cells = topic.generate(N_CORRECT, N_INCORRECT);
  G.grid = cells.map((c, i) => ({
    label:     c.label,
    isCorrect: c.isCorrect,
    eaten:     false,
    row:       (i / COLS) | 0,
    col:       i % COLS,
  }));
  G.nCorrect  = G.grid.filter(c => c.isCorrect).length;
  G.mRow      = 0;
  G.mCol      = 0;
  G.eaten     = 0;
  G.debugMode = false;
}

// ─────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────

function cellFontSize(label) {
  const len = label.length;
  if (len <=  2) return '1.25rem';
  if (len <=  3) return '1.1rem';
  if (len <=  5) return '0.95rem';
  if (len <=  7) return '0.82rem';
  if (len <= 10) return '0.66rem';
  if (len <= 14) return '0.56rem';
  return '0.48rem';
}

function cellIdx(row, col) { return row * COLS + col; }

// ─────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────

function renderLives() {
  document.getElementById('lives').textContent =
    '❤️'.repeat(G.lives) + '🤍'.repeat(MAX_LIVES - G.lives);
}

function renderScorebar() {
  document.getElementById('eatCount').textContent = G.eaten;
  document.getElementById('eatTotal').textContent = G.nCorrect;
  document.getElementById('levelNum').textContent  = G.level;
}

function renderChallenge() {
  document.getElementById('challenge').textContent =
    TOPICS_BY_CAT[G.catId][G.topicIdx].challenge;
}

function makeEl(tag, className) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  return el;
}

function renderGrid() {
  const $grid = document.getElementById('grid');
  $grid.innerHTML = '';

  G.grid.forEach((cell, idx) => {
    const div    = makeEl('div', 'cell');
    div.dataset.idx = idx;

    if (G.debugMode && !cell.eaten) {
      div.classList.add(cell.isCorrect ? 'debug-valid' : 'debug-invalid');
    }

    const isHere = (cell.row === G.mRow && cell.col === G.mCol);

    if (cell.eaten) {
      div.classList.add('eaten-cell');
      if (isHere) {
        const icon = makeEl('span', 'muncher-icon');
        icon.textContent = '😋';
        div.appendChild(icon);
      } else {
        const chk = makeEl('span', 'eaten-check');
        chk.textContent = '✓';
        div.appendChild(chk);
      }
    } else {
      div.style.fontSize = cellFontSize(cell.label);

      if (isHere) {
        div.classList.add('muncher-here');
        const icon = makeEl('span', 'muncher-icon');
        icon.textContent = '😋';
        div.appendChild(icon);
      }

      const lbl = makeEl('span', 'cell-label');
      lbl.textContent = cell.label;
      div.appendChild(lbl);
    }

    // ── Mouse events ──
    // FIX: detect double-click manually (same approach as double-tap)
    // so re-rendering the grid between clicks doesn't break dblclick detection.
    div.addEventListener('click', (e) => {
      e.stopPropagation();
      handleClick(cell.row, cell.col);
    });

    // ── Touch events ──
    // preventDefault stops synthesised mouse events so we don't double-fire.
    div.addEventListener('touchend', (e) => {
      e.preventDefault();
      handleTap(cell.row, cell.col);
    });

    $grid.appendChild(div);
  });
}

function render() {
  renderLives();
  renderScorebar();
  renderChallenge();
  renderGrid();
}

// ─────────────────────────────────────────
//  ACTIONS
// ─────────────────────────────────────────

// handleTap: single=move, double=eat, triple on eaten cell=toggle debug mode
function handleTap(row, col) {
  if (G.gameOver || G.locked) return;
  const now = Date.now();
  const { row: lr, col: lc, t: lt, count: lcount } = G.lastClick;

  if (lr === row && lc === col && now - lt < 400) {
    const newCount = lcount + 1;
    if (newCount === 2) {
      const cell = G.grid[cellIdx(row, col)];
      if (!cell.eaten) {
        G.lastClick = { row: -1, col: -1, t: 0, count: 0 };
        handleEat(row, col);
      } else {
        // Already eaten — keep counting toward triple-tap
        G.lastClick = { row, col, t: now, count: newCount };
      }
    } else if (newCount >= 3) {
      G.lastClick = { row: -1, col: -1, t: 0, count: 0 };
      const cell = G.grid[cellIdx(row, col)];
      if (cell.eaten) {
        G.debugMode = !G.debugMode;
        renderGrid();
      }
    } else {
      G.lastClick = { row, col, t: now, count: newCount };
    }
    return;
  }

  G.lastClick = { row, col, t: now, count: 1 };
  handleMove(row, col);
}

function handleClick(row, col) {
  handleTap(row, col);
}

function handleMove(row, col) {
  if (G.gameOver || G.locked) return;
  G.mRow = row;
  G.mCol = col;
  renderGrid();
}

function handleEat(row, col) {
  if (G.gameOver || G.locked) return;

  // Move muncher there first
  G.mRow = row;
  G.mCol = col;

  const cell = G.grid[cellIdx(row, col)];
  if (cell.eaten) return;

  if (cell.isCorrect) {
    cell.eaten = true;
    G.eaten++;

    // FIX: update scorebar immediately so counter doesn't stay at 0
    renderScorebar();

    // Brief pop animation on the cell
    const el = document.querySelector(`[data-idx="${cellIdx(row, col)}"]`);
    if (el) {
      el.classList.add('correct-pop');
      el.addEventListener('animationend', () => el.classList.remove('correct-pop'), { once: true });
    }

    if (G.eaten >= G.nCorrect) {
      setTimeout(levelComplete, 280);
    } else {
      renderGrid();
    }

  } else {
    // WRONG — shake, lose a life, reset to (0,0)
    G.locked = true;
    G.lives  = Math.max(0, G.lives - 1);
    renderLives();

    const el = document.querySelector(`[data-idx="${cellIdx(row, col)}"]`);
    if (el) el.classList.add('wrong-flash');

    setTimeout(() => {
      G.locked = false;
      G.mRow   = 0;
      G.mCol   = 0;
      if (G.lives <= 0) {
        gameOver();
      } else {
        renderGrid();
      }
    }, 500);
  }
}

// ─────────────────────────────────────────
//  OVERLAYS
// ─────────────────────────────────────────

function showOverlay(emoji, title, msg, btnLabel, onBtn) {
  document.getElementById('overlay-emoji').textContent = emoji;
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent   = msg;
  const btn   = document.getElementById('overlay-btn');
  btn.textContent = btnLabel;
  btn.onclick     = onBtn;
  document.getElementById('overlay').classList.add('visible');
}

function hideOverlay() {
  document.getElementById('overlay').classList.remove('visible');
}

function levelComplete() {
  const gained = G.lives < MAX_LIVES;
  if (gained) G.lives = Math.min(G.lives + 1, MAX_LIVES);
  G.level++;
  showOverlay(
    '🎉',
    'Level Complete!',
    gained
      ? `+1 life! You now have ${G.lives} ❤️\n\nKeep going!`
      : `Lives maxed out at ${G.lives} ❤️\n\nAmazing work!`,
    'Next Level →',
    () => { hideOverlay(); generateBoard(); render(); }
  );
}

function gameOver() {
  G.gameOver = true;
  showOverlay(
    '😵',
    'Game Over!',
    `You reached Level ${G.level}.\nPractise makes perfect!`,
    '🔄 Play Again',
    resetGame
  );
}

function resetGame() {
  hideOverlay();
  G.lives     = INIT_LIVES;
  G.level     = 1;
  G.gameOver  = false;
  G.locked    = false;
  G.lastClick = { row: -1, col: -1, t: 0, count: 0 };
  generateBoard();
  render();
}

function onCategoryChange() {
  G.catId    = $catSelect.value;
  G.topicIdx = 0;
  initTopicSelect(G.catId);
  resetGame();
}

function onTopicChange() {
  G.topicIdx = parseInt($topicSelect.value, 10);
  resetGame();
}

// ─────────────────────────────────────────
//  KEYBOARD
// ─────────────────────────────────────────

document.addEventListener('keydown', (e) => {
  if (G.gameOver || G.locked) return;

  let r = G.mRow, c = G.mCol;

  switch (e.key) {
    case 'ArrowUp':    r = Math.max(0,        r - 1); break;
    case 'ArrowDown':  r = Math.min(ROWS - 1, r + 1); break;
    case 'ArrowLeft':  c = Math.max(0,        c - 1); break;
    case 'ArrowRight': c = Math.min(COLS - 1, c + 1); break;
    case 'Enter':
    case ' ':
      e.preventDefault();
      handleEat(G.mRow, G.mCol);
      return;
    default: return;
  }

  e.preventDefault();
  handleMove(r, c);
});

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────

initCategorySelect();
initTopicSelect(G.catId);
generateBoard();
render();
</script>
</body>
</html>
