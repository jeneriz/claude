<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌟 Muncher!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
      background: linear-gradient(160deg, #fef9c3 0%, #ede9fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 20px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      font-family: 'Fredoka One', 'Comic Sans MS', cursive;
      font-size: 2.2rem;
      color: #6d28d9;
      text-shadow: 3px 3px 0 #ddd6fe;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    /* ── TOP BAR ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
      width: 100%;
      max-width: 600px;
    }

    #topicSelect {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 7px 14px;
      border: 3px solid #7c3aed;
      border-radius: 14px;
      background: white;
      color: #4c1d95;
      cursor: pointer;
      outline: none;
      flex: 1;
      min-width: 170px;
    }
    #topicSelect:focus { border-color: #4338ca; }

    #lives {
      font-size: 1.35rem;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* ── SCORE BAR ── */
    #scorebar {
      display: flex;
      gap: 20px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #4c1d95;
      margin-bottom: 8px;
    }

    /* ── CHALLENGE BANNER ── */
    #challenge {
      font-family: 'Fredoka One', 'Comic Sans MS', cursive;
      font-size: 1.25rem;
      color: white;
      background: linear-gradient(135deg, #7c3aed, #4338ca);
      border-radius: 18px;
      padding: 10px 22px;
      margin-bottom: 10px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(109,40,217,0.35);
      max-width: 600px;
      width: 100%;
    }

    /* ── GRID ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      width: 100%;
      max-width: 600px;
    }

    /* ── CELL ── */
    .cell {
      background: white;
      border: 3px solid #c4b5fd;
      border-radius: 12px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #3730a3;
      cursor: pointer;
      word-break: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      text-align: center;
      padding: 4px 3px;
      line-height: 1.15;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
    }
    .cell:active { transform: scale(0.94); }

    .cell.muncher-here {
      border-color: #f59e0b;
      background: #fef3c7;
      box-shadow: 0 0 0 2px #fcd34d inset;
    }

    .cell.eaten-cell {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .cell.wrong-flash {
      background: #fee2e2 !important;
      border-color: #fca5a5 !important;
      animation: shake 0.45s ease;
    }

    .cell.correct-pop {
      animation: pop 0.22s ease;
    }

    .muncher-icon {
      font-size: 1.55rem;
      line-height: 1;
      display: block;
    }

    .cell-label {
      font-size: inherit;
      line-height: 1.15;
    }

    /* shrink label when muncher is also displayed */
    .cell.muncher-here .cell-label {
      font-size: 0.58em;
      color: #6d28d9;
    }

    .eaten-check {
      font-size: 1.4rem;
      color: #6ee7b7;
    }

    /* ── ANIMATIONS ── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%       { transform: translateX(-7px); }
      35%       { transform: translateX(7px); }
      55%       { transform: translateX(-5px); }
      75%       { transform: translateX(5px); }
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    /* ── INSTRUCTIONS ── */
    #instructions {
      margin-top: 10px;
      font-size: 0.7rem;
      color: #7c3aed;
      text-align: center;
      opacity: 0.8;
      line-height: 1.6;
    }

    /* ── OVERLAY ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.52);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #overlay.visible { display: flex; }

    #overlay-box {
      background: white;
      border-radius: 28px;
      padding: 36px 40px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      animation: popIn 0.3s cubic-bezier(.18,.89,.32,1.28);
    }
    @keyframes popIn {
      from { transform: scale(0.65); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    #overlay-emoji  { font-size: 4rem; display: block; margin-bottom: 4px; }
    #overlay-title  {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: #4c1d95;
      margin: 4px 0 10px;
    }
    #overlay-msg {
      font-size: 1rem;
      color: #6b7280;
      margin-bottom: 22px;
      line-height: 1.55;
      white-space: pre-line;
    }
    #overlay-btn {
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 12px 36px;
      background: linear-gradient(135deg, #7c3aed, #4338ca);
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(109,40,217,0.35);
      transition: transform 0.1s;
    }
    #overlay-btn:hover  { transform: scale(1.05); }
    #overlay-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

<h1>🌟 Muncher!</h1>

<div id="topbar">
  <select id="topicSelect" onchange="onTopicChange()"></select>
  <div id="lives"></div>
</div>

<div id="scorebar">
  <span>🍽️ <span id="eatCount">0</span> / 20</span>
  <span>📋 Level <span id="levelNum">1</span></span>
</div>

<div id="challenge">Loading…</div>

<div id="grid"></div>

<p id="instructions">
  Click to move &nbsp;·&nbsp; Double-click or double-tap to eat<br>
  ⬆ ⬇ ⬅ ➡ arrow keys to move &nbsp;·&nbsp; Enter / Space to eat
</p>

<div id="overlay">
  <div id="overlay-box">
    <span id="overlay-emoji">🎉</span>
    <div id="overlay-title">Level Complete!</div>
    <div id="overlay-msg"></div>
    <button id="overlay-btn">Next Level →</button>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────
//  UTILITIES
// ─────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickN(arr, n) {
  return shuffle(arr).slice(0, n);
}

// ─────────────────────────────────────────
//  TOPIC: Multiples of N
// ─────────────────────────────────────────

function multiplesTopic(n) {
  // Ensure at least 20 correct answers: go up to n * 25
  const correct   = [];
  const incorrect = [];
  const max = n * 25;
  for (let i = 1; i <= max; i++) {
    (i % n === 0 ? correct : incorrect).push(i);
  }
  return {
    id:        `mult${n}`,
    label:     `Multiples of ${n}`,
    icon:      '🔢',
    challenge: `🍽️  Eat all multiples of ${n}!`,
    generate(nc, ni) {
      return shuffle([
        ...pickN(correct,   nc).map(v => ({ label: String(v), isCorrect: true  })),
        ...pickN(incorrect, ni).map(v => ({ label: String(v), isCorrect: false })),
      ]);
    }
  };
}

// ─────────────────────────────────────────
//  TOPIC: Coastal Countries
// ─────────────────────────────────────────

const COASTAL = [
  'Australia','Brazil','Canada','China','France','Germany','Greece',
  'India','Indonesia','Italy','Japan','Kenya','Malaysia','Mexico',
  'Morocco','Netherlands','New Zealand','Nigeria','Norway','Peru',
  'Philippines','Portugal','Russia','South Africa','Spain','Sweden',
  'Thailand','Turkey','United Kingdom','United States','Vietnam',
  'Argentina','Chile','Colombia','Denmark','Ecuador','Egypt','Finland',
  'Ghana','Ireland','Croatia','South Korea','Pakistan','Bangladesh',
  'Sri Lanka','Tanzania','Mozambique','Angola','Cameroon','Senegal',
  'Cuba','Jamaica','Haiti','Iceland','Oman','UAE','Saudi Arabia',
  'Iran','Qatar','Kuwait','Israel','Lebanon','Libya','Tunisia','Algeria',
  'Romania','Ukraine','Georgia','Azerbaijan','Myanmar','Cambodia',
  'Somalia','Eritrea','Djibouti','Mauritania','Liberia','Sierra Leone',
];

const LANDLOCKED = [
  'Afghanistan','Austria','Bolivia','Botswana','Chad','Czech Republic',
  'Ethiopia','Hungary','Kazakhstan','Laos','Lesotho','Luxembourg',
  'Mali','Moldova','Mongolia','Nepal','Niger','Paraguay','Rwanda',
  'Serbia','Slovakia','Switzerland','Uganda','Uzbekistan','Zimbabwe',
  'Zambia','Burkina Faso','Malawi','Eswatini','Kosovo',
  'North Macedonia','Armenia','Belarus','South Sudan',
  'Tajikistan','Kyrgyzstan','Turkmenistan','Andorra','Liechtenstein',
  'Bhutan','Burundi','Central African Republic','Niger','San Marino',
];

const coastalTopic = {
  id:        'coastal',
  label:     'Coastal Countries',
  icon:      '🌊',
  challenge: '🌊  Eat the coastal countries!',
  generate(nc, ni) {
    return shuffle([
      ...pickN(COASTAL,    nc).map(v => ({ label: v, isCorrect: true  })),
      ...pickN(LANDLOCKED, ni).map(v => ({ label: v, isCorrect: false })),
    ]);
  }
};

// ─────────────────────────────────────────
//  TOPIC REGISTRY
// ─────────────────────────────────────────

const TOPICS = [
  multiplesTopic(2),
  multiplesTopic(3),
  multiplesTopic(4),
  multiplesTopic(5),
  multiplesTopic(6),
  multiplesTopic(7),
  multiplesTopic(8),
  multiplesTopic(9),
  coastalTopic,
];

// Populate <select>
const $select = document.getElementById('topicSelect');
TOPICS.forEach((t, i) => {
  const opt = document.createElement('option');
  opt.value       = i;
  opt.textContent = `${t.icon}  ${t.label}`;
  $select.appendChild(opt);
});

// ─────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────

const ROWS        = 6;
const COLS        = 5;
const TOTAL       = ROWS * COLS;   // 30
const N_CORRECT   = 20;
const N_INCORRECT = TOTAL - N_CORRECT; // 10
const MAX_LIVES   = 7;
const INIT_LIVES  = 5;

// ─────────────────────────────────────────
//  GAME STATE
// ─────────────────────────────────────────

let G = {
  lives:    INIT_LIVES,
  level:    1,
  topicIdx: 0,
  grid:     [],   // [{label, isCorrect, eaten, row, col}]
  mRow:     0,
  mCol:     0,
  eaten:    0,    // correct cells eaten this level
  gameOver: false,
  locked:   false, // true during wrong-eat animation
  lastTap:  { row: -1, col: -1, t: 0 }, // double-tap tracking
};

// ─────────────────────────────────────────
//  BOARD GENERATION
// ─────────────────────────────────────────

function generateBoard() {
  const cells = TOPICS[G.topicIdx].generate(N_CORRECT, N_INCORRECT);
  G.grid = cells.map((c, i) => ({
    label:     c.label,
    isCorrect: c.isCorrect,
    eaten:     false,
    row:       (i / COLS) | 0,
    col:       i % COLS,
  }));
  G.mRow  = 0;
  G.mCol  = 0;
  G.eaten = 0;
}

// ─────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────

function cellFontSize(label) {
  const len = label.length;
  if (len <=  2) return '1.25rem';
  if (len <=  3) return '1.1rem';
  if (len <=  5) return '0.95rem';
  if (len <=  8) return '0.82rem';
  if (len <= 12) return '0.7rem';
  return '0.6rem';
}

function cellIdx(row, col) { return row * COLS + col; }

// ─────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────

function renderLives() {
  document.getElementById('lives').textContent =
    '❤️'.repeat(G.lives) + '🤍'.repeat(MAX_LIVES - G.lives);
}

function renderScorebar() {
  document.getElementById('eatCount').textContent = G.eaten;
  document.getElementById('levelNum').textContent  = G.level;
}

function renderChallenge() {
  document.getElementById('challenge').textContent = TOPICS[G.topicIdx].challenge;
}

function makeEl(tag, className) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  return el;
}

function renderGrid() {
  const $grid = document.getElementById('grid');
  $grid.innerHTML = '';

  G.grid.forEach((cell, idx) => {
    const div    = makeEl('div', 'cell');
    div.dataset.idx = idx;

    const isHere = (cell.row === G.mRow && cell.col === G.mCol);

    if (cell.eaten) {
      div.classList.add('eaten-cell');
      if (isHere) {
        // Muncher standing on an already-eaten cell
        const icon = makeEl('span', 'muncher-icon');
        icon.textContent = '😋';
        div.appendChild(icon);
      } else {
        const chk = makeEl('span', 'eaten-check');
        chk.textContent = '✓';
        div.appendChild(chk);
      }
    } else {
      // Cell not yet eaten
      div.style.fontSize = cellFontSize(cell.label);

      if (isHere) {
        div.classList.add('muncher-here');
        const icon = makeEl('span', 'muncher-icon');
        icon.textContent = '😋';
        div.appendChild(icon);
      }

      const lbl = makeEl('span', 'cell-label');
      lbl.textContent = cell.label;
      div.appendChild(lbl);
    }

    // ── Mouse events (desktop) ──
    div.addEventListener('click', () => handleClick(cell.row, cell.col));
    div.addEventListener('dblclick', (e) => {
      e.preventDefault();
      handleEat(cell.row, cell.col);
    });

    // ── Touch events (mobile) ──
    // preventDefault stops synthesised mouse events so we don't double-fire.
    div.addEventListener('touchend', (e) => {
      e.preventDefault();
      const now = Date.now();
      const { row: lr, col: lc, t: lt } = G.lastTap;
      if (lr === cell.row && lc === cell.col && now - lt < 450) {
        G.lastTap = { row: -1, col: -1, t: 0 };
        handleEat(cell.row, cell.col);
      } else {
        G.lastTap = { row: cell.row, col: cell.col, t: now };
        handleClick(cell.row, cell.col);
      }
    });

    $grid.appendChild(div);
  });
}

function render() {
  renderLives();
  renderScorebar();
  renderChallenge();
  renderGrid();
}

// ─────────────────────────────────────────
//  ACTIONS
// ─────────────────────────────────────────

function handleClick(row, col) {
  if (G.gameOver || G.locked) return;
  G.mRow = row;
  G.mCol = col;
  renderGrid();
}

function handleEat(row, col) {
  if (G.gameOver || G.locked) return;

  // Move muncher there first
  G.mRow = row;
  G.mCol = col;

  const cell = G.grid[cellIdx(row, col)];
  if (cell.eaten) return; // nothing left to eat here

  if (cell.isCorrect) {
    cell.eaten = true;
    G.eaten++;

    // Brief pop animation on the cell
    const el = document.querySelector(`[data-idx="${cellIdx(row, col)}"]`);
    if (el) {
      el.classList.add('correct-pop');
      el.addEventListener('animationend', () => el.classList.remove('correct-pop'), { once: true });
    }

    if (G.eaten >= N_CORRECT) {
      setTimeout(levelComplete, 280);
    } else {
      renderGrid();
    }

  } else {
    // WRONG — shake, lose a life, reset to (0,0)
    G.locked = true;
    G.lives  = Math.max(0, G.lives - 1);
    renderLives();

    const el = document.querySelector(`[data-idx="${cellIdx(row, col)}"]`);
    if (el) el.classList.add('wrong-flash');

    setTimeout(() => {
      G.locked = false;
      G.mRow   = 0;
      G.mCol   = 0;
      if (G.lives <= 0) {
        gameOver();
      } else {
        renderGrid();
      }
    }, 500);
  }
}

// ─────────────────────────────────────────
//  OVERLAYS
// ─────────────────────────────────────────

function showOverlay(emoji, title, msg, btnLabel, onBtn) {
  document.getElementById('overlay-emoji').textContent = emoji;
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent   = msg;
  const btn   = document.getElementById('overlay-btn');
  btn.textContent = btnLabel;
  btn.onclick     = onBtn;
  document.getElementById('overlay').classList.add('visible');
}

function hideOverlay() {
  document.getElementById('overlay').classList.remove('visible');
}

function levelComplete() {
  const gained = G.lives < MAX_LIVES;
  if (gained) G.lives = Math.min(G.lives + 1, MAX_LIVES);
  G.level++;
  showOverlay(
    '🎉',
    'Level Complete!',
    gained
      ? `+1 life! You now have ${G.lives} ❤️\n\nKeep going!`
      : `Lives maxed out at ${G.lives} ❤️\n\nAmazing work!`,
    'Next Level →',
    () => { hideOverlay(); generateBoard(); render(); }
  );
}

function gameOver() {
  G.gameOver = true;
  showOverlay(
    '😵',
    'Game Over!',
    `You reached Level ${G.level}.\nPractise makes perfect!`,
    '🔄 Play Again',
    resetGame
  );
}

function resetGame() {
  hideOverlay();
  G.lives    = INIT_LIVES;
  G.level    = 1;
  G.gameOver = false;
  G.locked   = false;
  generateBoard();
  render();
}

function onTopicChange() {
  G.topicIdx = parseInt($select.value, 10);
  resetGame();
}

// ─────────────────────────────────────────
//  KEYBOARD
// ─────────────────────────────────────────

document.addEventListener('keydown', (e) => {
  if (G.gameOver || G.locked) return;

  let r = G.mRow, c = G.mCol;

  switch (e.key) {
    case 'ArrowUp':    r = Math.max(0,        r - 1); break;
    case 'ArrowDown':  r = Math.min(ROWS - 1, r + 1); break;
    case 'ArrowLeft':  c = Math.max(0,        c - 1); break;
    case 'ArrowRight': c = Math.min(COLS - 1, c + 1); break;
    case 'Enter':
    case ' ':
      e.preventDefault();
      handleEat(G.mRow, G.mCol);
      return;
    default: return;
  }

  e.preventDefault();
  handleClick(r, c);
});

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────

generateBoard();
render();
</script>
</body>
</html>
